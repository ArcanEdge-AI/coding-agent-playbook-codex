<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="codex-engineering-team-title codex-engineering-team-desc">
  <title id="codex-engineering-team-title">Codex engineering-team operating model</title>
  <desc id="codex-engineering-team-desc">The main agent owns planning, direct implementation, integration, validation, and the final result, with bounded helpers only when justified and independent verification when required.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#425466"/></marker>
    <style>.bg{fill:#f8fafc}.node{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}.decision{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.5}.label{fill:#172033;font:600 24px Arial,sans-serif;text-anchor:middle}.sub{fill:#425466;font:400 16px Arial,sans-serif;text-anchor:middle}.role{fill:#172033;font:600 16px Arial,sans-serif;text-anchor:middle}.line{fill:none;stroke:#425466;stroke-width:2.5;marker-end:url(#arrow)}.optional{stroke-dasharray:5,4}</style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <text x="600" y="44" class="label">Direct execution, bounded assistance, verified results</text>
  <path class="line" d="M240 136H300"/>
  <path class="line" d="M624 136H684"/>
  <path class="line" d="M856 184V236"/>
  <path class="line" d="M600 368V420"/>
  <path class="line optional" d="M264 368V392Q264 400 256 400H232Q224 400 224 408V420"/>
  <path class="line optional" d="M368 460H420"/>
  <path class="line" d="M776 460H836"/>
  <path class="line" d="M940 496V548"/>
  <path class="line" d="M800 592H784Q776 592 776 584V520Q776 512 768 512H608Q600 512 600 504V500"/>
  <path class="line" d="M940 632V652"/>
  <rect class="node" x="80" y="96" width="160" height="80" rx="8"/><text x="160" y="144" class="label">User</text>
  <rect class="accent" x="304" y="88" width="320" height="96" rx="8"/><text x="464" y="128" class="label">Main Agent / Root</text><text x="464" y="156" class="sub">Owns the requested outcome</text>
  <rect class="node" x="688" y="88" width="336" height="96" rx="8"/><text x="856" y="128" class="label">Understand + Plan</text><text x="856" y="156" class="sub">Define scope, dependencies, and checks</text>
  <rect class="node" x="192" y="240" width="816" height="128" rx="8"/><text x="600" y="280" class="label">Main agent implements directly</text>
  <text x="600" y="316" class="sub">Complete coherent work and apply the relevant skills.</text>
  <text x="600" y="344" class="sub">Consult role perspectives without changing main-agent settings.</text>
  <rect class="node optional" x="80" y="424" width="288" height="176" rx="8"/><text x="224" y="456" class="role">Helpers only when justified</text>
  <text x="224" y="488" class="sub">Planner · Engineer · Reviewer</text><text x="224" y="516" class="sub">Tester · Docs</text>
  <text x="224" y="548" class="sub">Bounded work, task-selected route</text><text x="224" y="576" class="sub">No helper descendants</text>
  <rect class="accent" x="424" y="424" width="352" height="72" rx="8"/><text x="600" y="468" class="label">Main agent integrates</text>
  <rect class="node" x="840" y="424" width="200" height="72" rx="8"/><text x="940" y="468" class="label">Validation</text>
  <rect class="decision" x="800" y="552" width="280" height="80" rx="8"/><text x="940" y="584" class="label">Accept, reject,</text><text x="940" y="612" class="label">or correct</text>
  <text x="940" y="680" class="label">Result + evidence + limits</text>
  <line x1="48" y1="696" x2="1152" y2="696" stroke="#cbd5e1"/>
  <text x="600" y="720" class="sub">Solid: direct execution. Dashed: assistance when justified.</text>
  <text x="600" y="744" class="sub">Independent verification remains required when applicable; self-review does not replace it.</text>
</svg>
